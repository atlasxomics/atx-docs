name: Docs

# Build the docs on every push / PR. `--strict` turns MkDocs' validation
# warnings into errors, so a broken cross-reference (dead #anchor, link to a
# page that doesn't exist, page missing from the nav) fails CI instead of
# shipping silently to the published site.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build docs (strict — fails on broken links/anchors)
        run: mkdocs build --strict
